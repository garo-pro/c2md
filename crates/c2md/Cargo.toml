[package]
name = "c2md"
version = "0.1.0"
edition = "2021"
description = "Claude Code Stop hook that renders the last answer to HTML and opens it in a browser"
license = "MIT"

[[bin]]
name = "c2md"
path = "src/main.rs"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
